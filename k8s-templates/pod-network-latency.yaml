name: pod-network-latency
identity: podnetworklatency
kind: ChaosExperimentTemplate
apiVersion: litmuschaos.io/v1beta1
spec:
  infraType: KubernetesV2
  faults:
    - name: pod-network-latency-rb0
      identity: pod-network-latency
      revision: v1
      isEnterprise: true
      values:
        - name: TARGET_WORKLOAD_KIND
          value: deployment
        - name: TARGET_WORKLOAD_NAMESPACE
          value: <+input>
        - name: TARGET_WORKLOAD_NAMES
          value: <+input>
        - name: TOTAL_CHAOS_DURATION
          value: 300
        - name: NETWORK_LATENCY
          value: <+input>
        - name: POD_AFFECTED_PERCENTAGE
          value: 100
      authEnabled: false
  vertices:
    - name: v-rbo
      start:
        faults:
          - name: pod-network-latency-rb0
      end: {}
    - name: v-end
      start: {}
      end:
        faults:
          - name: pod-network-latency-rb0
  cleanupPolicy: delete
revision: v1
isDefault: true
