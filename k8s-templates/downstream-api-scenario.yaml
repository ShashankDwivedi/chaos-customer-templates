name: pod-api-block
identity: podapiblock
description: To target downstream APIs
kind: ChaosExperimentTemplate
apiVersion: litmuschaos.io/v1beta1
spec:
  infraType: KubernetesV2
  faults:
    - name: pod-api-block-0w1
      identity: pod-api-block
      revision: v1
      isEnterprise: true
      values:
        - name: TARGET_WORKLOAD_KIND
          value: <+input>
        - name: TARGET_WORKLOAD_NAMESPACE
          value: <+input>
        - name: TARGET_WORKLOAD_NAMES
          value: <+input>
        - name: TOTAL_CHAOS_DURATION
          value: 300
        - name: PATH_FILTER
          value: <+input>
        - name: TRANSACTION_PERCENTAGE
          value: 100
        - name: SERVICE_DIRECTION
          value: egress
        - name: POD_AFFECTED_PERCENTAGE
          value: 100
        - name: DESTINATION_PORTS
          value: <+input>
        - name: DESTINATION_HOSTS
          value: <+input>
      authEnabled: true
  vertices:
    - name: v-0xf
      start:
        faults:
          - name: pod-api-block-0w1
      end: {}
    - name: v-end
      start: {}
      end:
        faults:
          - name: pod-api-block-0w1
  cleanupPolicy: delete
revision: v1
isDefault: true
