name: pod-memory-hog
identity: podmemoryhog
kind: ChaosExperimentTemplate
apiVersion: litmuschaos.io/v1beta1
spec:
  infraType: KubernetesV2
  faults:
    - name: pod-memory-hog-gxp
      identity: pod-memory-hog
      revision: v1
      isEnterprise: true
      values:
        - name: TARGET_WORKLOAD_KIND
          value: deployment
        - name: TARGET_WORKLOAD_NAMESPACE
          value: <+input>
        - name: TARGET_WORKLOAD_NAMES
          value: <+input>
        - name: TOTAL_CHAOS_DURATION
          value: 180
        - name: NUMBER_OF_WORKERS
          value: <+input>
        - name: MEMORY_CONSUMPTION
          value: <+input>
        - name: POD_AFFECTED_PERCENTAGE
          value: 100
      authEnabled: false
  vertices:
    - name: v-gyr
      start:
        faults:
          - name: pod-memory-hog-gxp
      end: {}
    - name: v-end
      start: {}
      end:
        faults:
          - name: pod-memory-hog-gxp
  cleanupPolicy: delete
revision: v1
isDefault: true
