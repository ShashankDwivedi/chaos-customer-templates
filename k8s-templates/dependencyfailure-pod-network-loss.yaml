name: dependencyfailure-pod-network-loss
identity: dependencyfailurepodnetworkloss
kind: ChaosExperimentTemplate
apiVersion: litmuschaos.io/v1beta1
spec:
  infraType: KubernetesV2
  faults:
    - name: pod-network-loss-szs
      identity: pod-network-loss
      revision: v1
      isEnterprise: true
      values:
        - name: TARGET_WORKLOAD_KIND
          value: deployment
        - name: TARGET_WORKLOAD_NAMESPACE
          value: <+input>
        - name: TARGET_WORKLOAD_NAMES
          value: <+input>
        - name: TOTAL_CHAOS_DURATION
          value: 300
        - name: POD_AFFECTED_PERCENTAGE
          value: 100
        - name: DESTINATION_IPS
          value: <+input>
        - name: DESTINATION_HOSTS
          value: <+input>
        - name: DESTINATION_PORTS
          value: <+input>
      authEnabled: false
  vertices:
    - name: v-t0e
      start:
        faults:
          - name: pod-network-loss-szs
      end: {}
    - name: v-end
      start: {}
      end:
        faults:
          - name: pod-network-loss-szs
  cleanupPolicy: delete
revision: v1
isDefault: true
