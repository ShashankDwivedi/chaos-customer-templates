name: ssl-certificates-expiration
identity: sslcertificatesexpiration
kind: ChaosExperimentTemplate
apiVersion: litmuschaos.io/v1beta1
spec:
  infraType: KubernetesV2
  faults:
    - name: time-chaos-aeu
      identity: time-chaos
      revision: v1
      isEnterprise: true
      values:
        - name: TARGET_WORKLOAD_KIND
          value: <+input>
        - name: TARGET_WORKLOAD_NAMESPACE
          value: <+input>
        - name: TARGET_WORKLOAD_NAMES
          value: <+input>
        - name: TOTAL_CHAOS_DURATION
          value: 180
        - name: OFFSET
          value: 17500h
        - name: POD_AFFECTED_PERCENTAGE
          value: 100
      authEnabled: false
  vertices:
    - name: v-agw
      start:
        faults:
          - name: time-chaos-aeu
      end: {}
    - name: v-end
      start: {}
      end:
        faults:
          - name: time-chaos-aeu
  cleanupPolicy: delete
revision: v1
isDefault: true
