name: linux-network-loss-progressive
identity: linuxnetworklossprogressive
kind: ChaosExperimentTemplate
apiVersion: litmuschaos.io/v1beta1
spec:
  infraType: Linux
  faults:
    - name: linux-network-loss-p25
      identity: linux-network-loss
      revision: v1
      isEnterprise: true
      values:
        - name: DURATION
          value: 120s
        - name: NETWORK_PACKET_LOSS_PERCENTAGE
          value: 25
      authEnabled: false
    - name: linux-network-loss-p50
      identity: linux-network-loss
      revision: v1
      isEnterprise: true
      values:
        - name: DURATION
          value: 120s
        - name: NETWORK_PACKET_LOSS_PERCENTAGE
          value: 50
      authEnabled: false
    - name: linux-network-loss-p75
      identity: linux-network-loss
      revision: v1
      isEnterprise: true
      values:
        - name: DURATION
          value: 120s
        - name: NETWORK_PACKET_LOSS_PERCENTAGE
          value: 75
      authEnabled: false
    - name: linux-network-loss-p100
      identity: linux-network-loss
      revision: v1
      isEnterprise: true
      values:
        - name: DURATION
          value: 120s
        - name: NETWORK_PACKET_LOSS_PERCENTAGE
          value: 100
      authEnabled: false
  actions:
    - name: delay-vm-96j
      identity: delay-vm
      isEnterprise: false
      continueOnCompletion: false
      values: []
    - name: delay-vm-lh1
      identity: delay-vm
      isEnterprise: false
      continueOnCompletion: false
      values: []
    - name: delay-vm-yx0
      identity: delay-vm
      isEnterprise: false
      continueOnCompletion: false
      values: []
    - name: delay-vm-8pl
      identity: delay-vm
      isEnterprise: false
      continueOnCompletion: false
      values: []
  vertices:
    - name: v-start
      start:
        faults:
          - name: linux-network-loss-p25
      end: {}
    - name: v-97f
      start:
        actions:
          - name: delay-vm-96j
      end:
        faults:
          - name: linux-network-loss-p25
    - name: v-25to50
      start:
        faults:
          - name: linux-network-loss-p50
      end:
        actions:
          - name: delay-vm-96j
    - name: v-li2
      start:
        actions:
          - name: delay-vm-lh1
      end:
        faults:
          - name: linux-network-loss-p50
    - name: v-50to75
      start:
        faults:
          - name: linux-network-loss-p75
      end:
        actions:
          - name: delay-vm-lh1
    - name: v-yxz
      start:
        actions:
          - name: delay-vm-yx0
      end:
        faults:
          - name: linux-network-loss-p75
    - name: v-75to100
      start:
        faults:
          - name: linux-network-loss-p100
      end:
        actions:
          - name: delay-vm-yx0
    - name: v-8qp
      start:
        actions:
          - name: delay-vm-8pl
      end:
        faults:
          - name: linux-network-loss-p100
    - name: v-end
      start: {}
      end:
        actions:
          - name: delay-vm-8pl
  cleanupPolicy: delete
revision: v1
isDefault: true
